apiVersion: v1
kind: Namespace
metadata:
  name: devsecops
  labels:
    # Pod Security Admission: everything runs restricted except the SonarQube sysctl
    # initContainer (privileged). Drop that initContainer and set vm.max_map_count on the
    # nodes to enforce "restricted" for the whole namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
