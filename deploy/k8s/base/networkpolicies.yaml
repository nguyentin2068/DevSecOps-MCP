# Default deny, then open only the paths the architecture needs:
#   MCP clients (namespaces labelled devsecops.io/mcp-client=true) -> mcp:3000
#   scanner pods (label devsecops.io/scanner=true, any namespace)  -> sonarqube:9000, zap:8080
#   sonarqube -> postgres:5432
# Scanner pods (Jenkins agents, Jobs) need the devsecops.io/scanner=true label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              devsecops.io/mcp-client: "true"
      ports:
        - port: 3000
          protocol: TCP
  # The MCP server only reads the mounted volume: it needs no network egress at all.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sonarqube
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              devsecops.io/scanner: "true"
      ports:
        - port: 9000
          protocol: TCP
    # Add a rule for your ingress controller's namespace to expose the SonarQube UI.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sonarqube
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zap
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              devsecops.io/scanner: "true"
      ports:
        - port: 8080
          protocol: TCP
