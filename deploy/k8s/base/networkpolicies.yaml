# Default deny ingress, then open only what the architecture needs:
#   MCP clients (namespaces labelled devsecops.io/mcp-client=true) -> mcp:3000
# Scanners are short-lived Jenkins agents or Jobs: they need egress (rule/DB updates, DAST
# targets) but no ingress. Restrict their egress in the namespace they run in, e.g. allow
# only your staging CIDRs for DAST pods labelled devsecops.io/scanner=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              devsecops.io/mcp-client: "true"
      ports:
        - port: 3000
          protocol: TCP
  # The MCP server only reads the mounted volume: it needs no network egress at all.
  egress: []
