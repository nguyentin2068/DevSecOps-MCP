apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarqube
  labels:
    app.kubernetes.io/name: sonarqube
spec:
  serviceName: sonarqube
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarqube
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # SonarQube's embedded Elasticsearch needs vm.max_map_count >= 524288 on the node.
        # This privileged initContainer sets it; if your platform forbids privileged pods,
        # delete it and set the sysctl on the nodes (DaemonSet, node image or tuning operator).
        - name: sysctl
          image: busybox:1.37
          command: ["sh", "-c", "sysctl -w vm.max_map_count=524288 && sysctl -w fs.file-max=131072"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: sonarqube
          image: sonarqube:26.9.0.129388-community
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://postgres:5432/sonar
            - name: SONAR_JDBC_USERNAME
              value: sonar
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: sonar-db-password
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          # The image has no curl/wget: probe the status endpoint over bash's /dev/tcp so the
          # pod only turns Ready once SonarQube reports "UP" (not merely "STARTING").
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /api/system/status HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: http
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
            - name: extensions
              mountPath: /opt/sonarqube/extensions
            - name: logs
              mountPath: /opt/sonarqube/logs
            - name: temp
              mountPath: /opt/sonarqube/temp
      volumes:
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: extensions
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  labels:
    app.kubernetes.io/name: sonarqube
spec:
  selector:
    app.kubernetes.io/name: sonarqube
  ports:
    - name: http
      port: 9000
      targetPort: http
