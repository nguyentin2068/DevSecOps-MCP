# Local self-hosted stack: read-only MCP server, SonarQube + PostgreSQL, OWASP ZAP daemon,
# and an on-demand scanner container (the same image Jenkins uses).
#
#   cp .env.example .env            # then fill in every secret
#   mkdir -p security-reports
#   docker compose up -d --build    # mcp, sonarqube, postgres, zap
#   docker compose run --rm scanner devsecops-scan sast --target /workspace/src
#
# Secrets have no defaults on purpose: compose refuses to start until .env provides them.
# Published ports bind to 127.0.0.1 only; put a TLS reverse proxy in front for remote access.

name: devsecops

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mcp:
    build:
      context: .
      target: mcp
    image: devsecops-mcp:${IMAGE_TAG:-local}
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env (openssl rand -hex 32)}
      REPORTS_DIR: /app/security-reports
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The MCP server only reads results; the scanner writes them.
      - ./security-reports:/app/security-reports:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-3000}:3000"
    networks: [devsecops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # On-demand scans: docker compose run --rm scanner devsecops-scan <type> ...
  scanner:
    build:
      context: .
      target: scanner
    image: devsecops-scanner:${IMAGE_TAG:-local}
    profiles: [scan]
    <<: *hardening
    # Match the owner of ./security-reports on the host (default 1000:1000).
    user: "${SCAN_UID:-1000}:${SCAN_GID:-1000}"
    environment:
      SCAN_WORKSPACE_ROOTS: /workspace
      REPORTS_DIR: /workspace/security-reports
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:?set ZAP_API_KEY in .env}
      TRIVY_CACHE_DIR: /var/cache/trivy
    volumes:
      - ${SCAN_SOURCE:-./test-samples}:/workspace/src:ro
      - ./security-reports:/workspace/security-reports
      - trivy-cache:/var/cache/trivy
    networks: [devsecops]

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
      # Local development only: skips the vm.max_map_count bootstrap check. On real hosts set
      # vm.max_map_count=524288 and remove this (see deploy/k8s for the cluster equivalent).
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    # Elasticsearch's bootstrap checks require at least 65535 open files.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      # UI is needed once to change the admin password and create the scanner token.
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    networks: [devsecops]
    restart: unless-stopped
    healthcheck:
      # The image ships neither curl nor wget, so the probe speaks HTTP over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /api/system/status HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
      POSTGRES_DB: sonar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [devsecops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  zap:
    # Official ZAP image (the owasp/zap2docker-* images are retired). Override with ZAP_IMAGE.
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    <<: *hardening
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=${ZAP_API_KEY:?set ZAP_API_KEY in .env}
      # Accept API calls from the compose network (the API key is still required).
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    networks: [devsecops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -H \"X-ZAP-API-Key: $${ZAP_API_KEY}\" http://127.0.0.1:8080/JSON/core/view/version/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:?set ZAP_API_KEY in .env}

  # Deliberately vulnerable demo app for trying DAST: docker compose --profile demo up -d dast-target
  # then: docker compose run --rm scanner devsecops-scan dast --target http://dast-target:3001/
  dast-target:
    image: devsecops-mcp:${IMAGE_TAG:-local}
    profiles: [demo]
    <<: *hardening
    read_only: true
    command: ["node", "/samples/vulnerable-server.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_PATH: /app/node_modules
    volumes:
      - ./test-samples:/samples:ro
    networks: [devsecops]
    healthcheck:
      disable: true

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  postgres-data:
  trivy-cache:

networks:
  devsecops:
    driver: bridge
