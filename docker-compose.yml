# Local self-hosted stack: an on-demand scanner container (the same image Jenkins uses:
# Opengrep, OSV-Scanner, Trivy, Katana + Nuclei) and, optionally, the read-only MCP server.
#
# Scanner only (no MCP, no .env needed):
#   mkdir -p security-reports
#   docker compose build scanner
#   docker compose run --rm scanner devsecops-scan sast --target /workspace/src
#
# With the MCP server (profile "mcp"; set MCP_AUTH_TOKEN in .env first):
#   cp .env.example .env
#   docker compose --profile mcp up -d --build mcp
#
# The MCP server refuses to start without a token of at least 32 characters.
# Published ports bind to 127.0.0.1 only; put a TLS reverse proxy in front for remote access.

name: devsecops

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Optional read-only MCP server for AI triage: docker compose --profile mcp up -d mcp
  mcp:
    profiles: [mcp]
    build:
      context: .
      target: mcp
    image: devsecops-mcp:${IMAGE_TAG:-local}
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      # Not enforced here so scanner-only use needs no .env; the server itself refuses to start
      # without a token of at least 32 characters (openssl rand -hex 32).
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      REPORTS_DIR: /app/security-reports
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The MCP server only reads results; the scanner writes them.
      - ./security-reports:/app/security-reports:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-3000}:3000"
    networks: [devsecops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # On-demand scans: docker compose run --rm scanner devsecops-scan <type> ...
  scanner:
    build:
      context: .
      target: scanner
    image: devsecops-scanner:${IMAGE_TAG:-local}
    profiles: [scan]
    <<: *hardening
    # Match the owner of ./security-reports on the host (default 1000:1000).
    user: "${SCAN_UID:-1000}:${SCAN_GID:-1000}"
    environment:
      SCAN_WORKSPACE_ROOTS: /workspace
      REPORTS_DIR: /workspace/security-reports
      TRIVY_CACHE_DIR: /var/cache/trivy
    volumes:
      - ${SCAN_SOURCE:-./test-samples}:/workspace/src:ro
      - ./security-reports:/workspace/security-reports
      - trivy-cache:/var/cache/trivy
    networks: [devsecops]

  # Deliberately vulnerable demo app for trying DAST: docker compose --profile demo up -d dast-target
  # then: docker compose run --rm scanner devsecops-scan dast --target http://dast-target:3001/
  dast-target:
    # Reuses the MCP image (Node + express) only as a runtime for the demo app.
    build:
      context: .
      target: mcp
    image: devsecops-mcp:${IMAGE_TAG:-local}
    profiles: [demo]
    <<: *hardening
    read_only: true
    command: ["node", "/samples/vulnerable-server.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_PATH: /app/node_modules
    volumes:
      - ./test-samples:/samples:ro
    networks: [devsecops]
    healthcheck:
      disable: true

volumes:
  trivy-cache:

networks:
  devsecops:
    driver: bridge
