# DevSecOps security policy, loaded by src/core/config.ts and validated with Joi.
# Used by the CLI security gate (Jenkins exit code) and by the MCP validate_security_policy tool.
# Override the path with SECURITY_RULES_PATH or the CLI --rules flag.

version: "2.0"

# Defaults applied to every scan type unless the scan type sets its own thresholds.
global_policy:
  # strict: violations fail the gate (exit code 1)
  # permissive: violations are reported as WARN and the gate passes (exit code 0)
  enforcement_level: strict
  # Maximum number of findings allowed per severity. Omit a severity (or set null) for no limit.
  # A failed scan or a result with missing data always counts as a violation.
  thresholds:
    critical: 0
    high: 0
    medium: 5
    low: 20

# Static analysis of source code.
sast:
  default_tool: semgrep
  thresholds:
    critical: 0
    high: 0
    medium: 5
  # Fail the gate when SonarQube reports its quality gate as anything other than OK.
  require_sonar_quality_gate: true
  semgrep:
    timeout_seconds: 900
    # Registry rulesets (p/...) need egress to semgrep.dev. For air-gapped runners,
    # point these at local rule files or directories inside the workspace instead.
    configs:
      - p/security-audit
      - p/secrets
      - p/owasp-top-ten
    exclude:
      - security-reports
      - node_modules
      - vendor
      - dist
      - build
      - target
  sonarqube:
    timeout_seconds: 1800
    exclusions:
      - "**/node_modules/**"
      - "**/vendor/**"
      - "**/dist/**"

# Dependency (software composition) analysis of a source tree.
sca:
  default_tool: osv-scanner
  thresholds:
    critical: 0
    high: 0
    medium: 3
    low: 10
  osv_scanner:
    timeout_seconds: 900
  trivy:
    timeout_seconds: 900
    scanners: [vuln, secret, misconfig]
    ignore_unfixed: false

# Container image scanning (Trivy image).
container:
  default_tool: trivy
  thresholds:
    critical: 0
    high: 0
  trivy:
    timeout_seconds: 1200
    scanners: [vuln, secret]
    ignore_unfixed: true

# Dynamic analysis of a running application (OWASP ZAP daemon via its API).
dast:
  default_tool: zap
  thresholds:
    critical: 0
    high: 0
    medium: 10
  zap:
    # baseline: spider + passive scan; full: adds the active scan (only against test environments)
    mode: baseline
    spider_max_minutes: 10
    passive_wait_minutes: 10
    active_max_minutes: 60
    max_alerts: 5000
  # SSRF guard. Loopback, link-local (cloud metadata 169.254.169.254) and reserved addresses
  # are refused unless allowlisted here. When any allowlist entry is set, only matching
  # targets are scanned. Hosts support a leading "*." wildcard.
  target_policy:
    allowed_hosts: []
    allowed_cidrs: []
