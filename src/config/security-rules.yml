# DevSecOps security policy, loaded by src/core/config.ts and validated with Joi.
# Used by the CLI security gate (Jenkins exit code) and by the MCP validate_security_policy tool.
# Override the path with SECURITY_RULES_PATH or the CLI --rules flag.

version: "2.0"

# Defaults applied to every scan type unless the scan type sets its own thresholds.
global_policy:
  # strict: violations fail the gate (exit code 1)
  # permissive: violations are reported as WARN and the gate passes (exit code 0)
  enforcement_level: strict
  # Maximum number of findings allowed per severity. Omit a severity (or set null) for no limit.
  # A failed scan or a result with missing data always counts as a violation.
  thresholds:
    critical: 0
    high: 0
    medium: 5
    low: 20

# Static analysis of source code (Opengrep, an LGPL fork of Semgrep CE).
sast:
  default_tool: opengrep
  # opengrep-rules is broad and reports many medium/low findings that are false positives on
  # ordinary code (e.g. path-join-resolve-traversal). They are recorded in the reports and
  # SARIF but do not gate the build (null = unlimited). Once the rule set is tuned for your
  # codebase, set medium to a number to start enforcing it.
  thresholds:
    critical: 0
    high: 0
    medium: null
    low: null
  opengrep:
    timeout_seconds: 900
    # Track tainted data across functions within a file (--taint-intrafile).
    taint_intrafile: true
    # Relative paths resolve against this file's directory; ${VAR} expands from the environment.
    # The scanner image ships opengrep-rules at a pinned commit in ${OPENGREP_RULES_DIR}.
    # Registry packs (p/...) are passed through as-is but are covered by the Semgrep Rules
    # License; prefer local rules you control.
    # Always run, whatever the code is written in:
    configs:
      - opengrep/baseline.yml
      - ${OPENGREP_RULES_DIR}/generic/secrets
    # Run only for the languages being scanned. `devsecops-scan detect` finds them from file
    # extensions (the Jenkins pre-check stage passes them on with --languages); without
    # --languages, `sast` detects them itself. A detected language with no entry here is
    # reported but not scanned with language rules. Remove an entry to stop scanning it.
    language_configs:
      bash: ["${OPENGREP_RULES_DIR}/bash"]
      c: ["${OPENGREP_RULES_DIR}/c"]
      clojure: ["${OPENGREP_RULES_DIR}/clojure"]
      csharp: ["${OPENGREP_RULES_DIR}/csharp"]
      dockerfile: ["${OPENGREP_RULES_DIR}/dockerfile", "${OPENGREP_RULES_DIR}/generic/dockerfile"]
      elixir: ["${OPENGREP_RULES_DIR}/elixir"]
      go: ["${OPENGREP_RULES_DIR}/go"]
      html: ["${OPENGREP_RULES_DIR}/html"]
      java: ["${OPENGREP_RULES_DIR}/java"]
      javascript: ["${OPENGREP_RULES_DIR}/javascript"]
      json: ["${OPENGREP_RULES_DIR}/json"]
      kotlin: ["${OPENGREP_RULES_DIR}/kotlin"]
      ocaml: ["${OPENGREP_RULES_DIR}/ocaml"]
      php: ["${OPENGREP_RULES_DIR}/php"]
      python: ["${OPENGREP_RULES_DIR}/python"]
      ruby: ["${OPENGREP_RULES_DIR}/ruby"]
      rust: ["${OPENGREP_RULES_DIR}/rust"]
      scala: ["${OPENGREP_RULES_DIR}/scala"]
      solidity: ["${OPENGREP_RULES_DIR}/solidity"]
      swift: ["${OPENGREP_RULES_DIR}/swift"]
      terraform: ["${OPENGREP_RULES_DIR}/terraform"]
      # Most JavaScript rules also match TypeScript.
      typescript: ["${OPENGREP_RULES_DIR}/javascript", "${OPENGREP_RULES_DIR}/typescript"]
      yaml: ["${OPENGREP_RULES_DIR}/yaml"]
    # Project rule IDs: findings report sast-<language>-<NNNN> instead of Opengrep's path-based
    # check_id, which is kept as original_rule_id. The catalog covers the pinned opengrep-rules
    # commit; regenerate it with tools/generate-rule-ids.mjs when bumping that commit. The bundled
    # rules (opengrep/baseline.yml) already carry project IDs. null = keep Opengrep's ids.
    rule_ids: opengrep/rule-ids.json
    # Also skipped by language detection (plain directory names only).
    exclude:
      - security-reports
      - node_modules
      - vendor
      - dist
      - build
      - target

# Dependency (software composition) analysis of a source tree.
sca:
  default_tool: osv-scanner
  thresholds:
    critical: 0
    high: 0
    medium: 3
    low: 10
  osv_scanner:
    timeout_seconds: 900
  trivy:
    timeout_seconds: 900
    scanners: [vuln, secret, misconfig]
    ignore_unfixed: false

# Container image scanning (Trivy image).
container:
  default_tool: trivy
  thresholds:
    critical: 0
    high: 0
  trivy:
    timeout_seconds: 1200
    scanners: [vuln, secret]
    ignore_unfixed: true

# Dynamic analysis of a running application: katana crawls, nuclei runs templates.
dast:
  default_tool: nuclei
  # Nuclei rates confirmed reflected XSS and open redirects as medium, so medium findings fail
  # the gate. Info findings (tech fingerprints, missing headers) are never gated.
  thresholds:
    critical: 0
    high: 0
    medium: 0
  # baseline: nuclei HTTP templates against the target URL (known CVEs, misconfigurations,
  #           exposures). No crawl: templates build their own paths from the base URL.
  # full:     baseline + katana crawl + nuclei's DAST fuzzing templates on crawled URLs that
  #           have parameters (active attacks: test environments only)
  mode: baseline
  # Used in full mode to find fuzzable URLs. Results are limited to the target's origin.
  crawl:
    enabled: true
    max_depth: 3
    max_duration_seconds: 300
    max_urls: 500
    # Parse JavaScript for endpoints (more coverage, more requests).
    js_crawl: false
  nuclei:
    timeout_seconds: 1800
    # The scanner image ships nuclei-templates at a pinned tag in ${NUCLEI_TEMPLATES_DIR}.
    templates:
      - ${NUCLEI_TEMPLATES_DIR}
    # Empty = all severities. Info-level findings (tech fingerprints) are not gated by default.
    severities: []
    include_tags: []
    # Never run denial-of-service or intrusive templates from CI.
    exclude_tags: [dos, intrusive]
    exclude_template_ids: []
    # Requests per second and parallel templates (nuclei's defaults). Lower for fragile targets.
    rate_limit: 150
    concurrency: 25
    request_timeout_seconds: 10
  # SSRF guard. Loopback, link-local (cloud metadata 169.254.169.254) and reserved addresses
  # are refused unless allowlisted here. When any allowlist entry is set, only matching
  # targets are scanned. Hosts support a leading "*." wildcard.
  target_policy:
    allowed_hosts: []
    allowed_cidrs: []
